<!doctype html>
<html lang="es">
<head> <link rel="icon" type="image/png" href="assets/favicon.ico" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Un puto juego de pesca</title>
<link rel="icon" type="image/png" href="favicon.png" />
<style>
  body {
    background: #1a1a2e;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    margin:0;
    font-family: monospace;
    color: white;
    /* Evitar selecciones accidentales en móviles */
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    overflow: hidden; /* Evitar scroll en toda la página */
  }
  
  /* Contenedor principal para mantener todo alineado */
  #gameContainer {
    position: relative;
    width: 100%;
    max-width: 960px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #game {
    width: 100%;
    /* Mantiene la proporción 16:9 (960x540) */
    aspect-ratio: 16 / 9;
    max-height: 100vh;
    image-rendering: pixelated;
    box-shadow:0 8px 30px rgba(0,0,0,0.8);
    border:6px solid #2b2b2b;
    border-radius: 4px;
    box-sizing: border-box;
    /* Evitar comportamientos predeterminados del navegador al tocar (como recargar al deslizar hacia abajo) */
    touch-action: none; 
  }

  #instructions {
    position:absolute;
    bottom:18px;
    color:#fff;
    background:rgba(0, 0, 0, 0.8);
    padding:10px 16px;
    border-radius:6px;
    font-size:14px;
    text-align: center;
    border: 2px solid #4aa6db;
    pointer-events: none; /* Que no interfiera con los toques */
  }
  #instructions span { font-weight: bold; }
  .c-gold { color: #FFD700; }
  .c-purp { color: #B388FF; }
  .c-pink { color: #FF4081; }
  .c-cyan { color: #00E5FF; }
  
  /* Botones móviles */
  #mobileControls {
    display: none; /* Ocultos por defecto, se muestran en pantallas pequeñas */
    position: absolute;
    bottom: 20px;
    width: 100%;
    justify-content: space-between;
    padding: 0 30px;
    box-sizing: border-box;
    pointer-events: none; /* Deja pasar los clicks al canvas por el centro */
  }
  .dir-btn {
    pointer-events: auto; /* Estos sí reciben clicks/toques */
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: rgba(255, 213, 79, 0.4);
    border: 3px solid rgba(255, 213, 79, 0.8);
    color: white;
    font-size: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0;
    padding: 0;
    box-shadow: none;
  }
  .dir-btn:active {
    background: rgba(255, 213, 79, 0.8);
    transform: scale(0.95);
  }

  #overlay {
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0.85);
    color:#fff;
    font-size:24px;
    visibility:hidden;
    z-index: 10;
  }
  #gameoverText { font-size: 48px; color: #FF6B6B; margin-bottom: 10px; text-shadow: 2px 2px #000; text-align:center; }
  
  button {
    margin-top:20px;
    padding:10px 20px;
    font-family:monospace;
    font-size:18px;
    font-weight: bold;
    border:none;
    border-radius:6px;
    background:#ffd54f;
    color: #111;
    cursor:pointer;
    box-shadow: 0 4px #c8a431;
    transition: transform 0.1s;
  }
  button:active {
    transform: translateY(4px);
    box-shadow: 0 0 #c8a431;
  }

 /* Media query para móviles */
  @media (max-width: 768px) {
    #instructions { 
      font-size: 10px; 
      bottom: 20px; /* <-- Ahora se anclará al fondo real de la pantalla */
      padding: 6px 10px;
      width: 90%; /* Evita que toque los bordes laterales del teléfono */
      box-sizing: border-box;
    }
    #mobileControls {
      display: flex;
      /* Opcional: Si sientes que los botones redondos están muy bajos, 
         puedes subir su posición ajustando este valor */
      bottom: 25%; 
    }
  }
</style>
</head>
<body>

<div id="gameContainer">
  <canvas id="game" width="320" height="180"></canvas>
  
  <div id="instructions">
    Controles: A/D o Botones = mover | Mouse/Tocar = pescar<br>
    Especiales: 
    <span class="c-gold">Oro (x2)</span> | 
    <span class="c-purp">Viol. (Lento)</span> | 
    <span class="c-pink">Rosa (+1❤️)</span> | 
    <span class="c-cyan">Cian (Rayo)</span><br>
    Minas (-1❤️) | Cangrejos (-2❤️) | Tiburón = Game Over
  </div>

  <div id="mobileControls">
    <button class="dir-btn" id="btnLeft">◀</button>
    <button class="dir-btn" id="btnRight">▶</button>
  </div>

  <div id="overlay">
    <div id="gameoverText">GAME OVER</div>
    <div id="scoreText"></div>
    <button id="resetBtn">Reiniciar</button>
  </div>
</div>

<script>
// --- MOTOR DE AUDIO 8-BIT ---
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new AudioContext();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  osc.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  
  if (type === 'catch') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(400, now);
    osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
    gainNode.gain.setValueAtTime(0.05, now);
    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    osc.start(now);
    osc.stop(now + 0.1);
  } else if (type === 'powerup') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.linearRampToValueAtTime(600, now + 0.1);
    osc.frequency.linearRampToValueAtTime(900, now + 0.2);
    gainNode.gain.setValueAtTime(0.05, now);
    gainNode.gain.linearRampToValueAtTime(0, now + 0.3);
    osc.start(now);
    osc.stop(now + 0.3);
  } else if (type === 'hit') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
    gainNode.gain.setValueAtTime(0.1, now);
    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
    osc.start(now);
    osc.stop(now + 0.2);
  } else if (type === 'gameover') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.exponentialRampToValueAtTime(50, now + 0.6);
    gainNode.gain.setValueAtTime(0.1, now);
    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
    osc.start(now);
    osc.stop(now + 0.6);
  }
}

// --- LOGICA DEL JUEGO ---
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const overlay = document.getElementById('overlay');
const resetBtn = document.getElementById('resetBtn');
const scoreText = document.getElementById('scoreText');

const W = canvas.width;
const H = canvas.height;

let score, bestScore, keys, boat, lure, fishes, enemies, slowMotion, flashTimer, hearts, gameOver;
let frameCount = 0;

function initGame() {
  score = 0;
  bestScore = parseInt(localStorage.getItem("bestScore") || "0");
  keys = { left:false, right:false };
  boat = { x:W/2, y:35, w:48, h:10, speed:1.8 };
  lure = { xOffset: 20, y:H/2, size:4 };
  fishes = [];
  enemies = [];
  slowMotion = 0;
  flashTimer = 0;
  hearts = 3;
  gameOver = false;
  overlay.style.visibility = "hidden";
  initAudio();
}

initGame();

const fishTypes = [
  {name:'pequeño', w:10, h:6, speed:1.6, color:'#7ED957', points:10},
  {name:'medio', w:14, h:8, speed:1.1, color:'#5FC2FF', points:25},
  {name:'grande', w:18, h:10, speed:0.6, color:'#FF6B6B', points:50},
  {name:'dorado', w:14, h:8, speed:1.2, color:'#FFD700', points:75, rare:true, effect:'x2'},
  {name:'violeta', w:14, h:8, speed:1.2, color:'#B388FF', points:60, rare:true, effect:'slow'},
  {name:'corazon', w:12, h:8, speed:1.4, color:'#FF4081', points:30, rare:true, effect:'heal'},
  {name:'electrico', w:16, h:6, speed:2.0, color:'#00E5FF', points:80, rare:true, effect:'zap'}
];

const enemyTypes = [
  {name:'mina', w:12, h:12, speed:0.8, color:'#444', damage:1},
  {name:'cangrejo', w:16, h:10, speed:1.0, color:'#D84315', damage:2},
  {name:'tiburon', w:28, h:12, speed:1.2, color:'#607D8B', damage:99}
];

function spawnFish() {
  const r = Math.random();
  let type;
  if (r < 0.45) type = fishTypes[0];
  else if (r < 0.70) type = fishTypes[1];
  else if (r < 0.85) type = fishTypes[2];
  else {
    const rareIndex = Math.floor(Math.random() * 4) + 3;
    type = fishTypes[rareIndex];
  }
  const fromLeft = Math.random() < 0.5;
  const y = Math.random() * (H * 0.4) + H * 0.50; 
  const x = fromLeft ? -type.w - 10 : W + type.w + 10;
  const dir = fromLeft ? 1 : -1;
  fishes.push({...type, x, y, dir, caught:false, wiggle:Math.random() * Math.PI * 2});
}

function spawnEnemy() {
  if (Math.random() < 0.6) return;
  const type = enemyTypes[Math.floor(Math.random() * enemyTypes.length)];
  const fromLeft = Math.random() < 0.5;
  const y = Math.random() * (H * 0.4) + H * 0.50;
  const x = fromLeft ? -type.w - 10 : W + type.w + 10;
  const dir = fromLeft ? 1 : -1;
  enemies.push({...type, x, y, dir});
}

function checkCollision(obj) {
  const lx = boat.x + lure.xOffset;
  const ly = lure.y;
  return (lx >= obj.x && lx <= obj.x + obj.w &&
          ly >= obj.y - 4 && ly <= obj.y + obj.h + 4);
}

function catchFish(i) {
  const f = fishes[i];
  if (f.caught) return;
  f.caught = true;
  f.speed = 3.5;
  f.dir = (boat.x > f.x) ? 1 : -1;
  score += f.points;
  
  if (f.rare) {
    triggerEffect(f.effect);
    playSound('powerup');
  } else {
    playSound('catch');
  }
  updateBestScore();
}

function triggerEffect(effect) {
  if (effect === 'x2') score *= 2;
  else if (effect === 'slow') slowMotion = 300;
  else if (effect === 'heal') hearts = Math.min(hearts + 1, 5);
  else if (effect === 'zap') { enemies = []; flashTimer = 15; }
}

function updateBestScore() {
  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem("bestScore", bestScore);
  }
}

function damageHearts(dmg) {
  hearts -= dmg;
  playSound('hit');
  if (hearts <= 0) endGame();
}

function endGame() {
  gameOver = true;
  playSound('gameover');
  overlay.style.visibility = "visible";
  scoreText.textContent = `Puntuación final: ${score}`;
}

// --- CONTROLES TECLADO ---
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'a') keys.left = true;
  if (k === 'd') keys.right = true;
});
window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k === 'a') keys.left = false;
  if (k === 'd') keys.right = false;
});

// --- CONTROLES MOUSE/TACTILES CAÑA ---
function updateRodPosition(clientY) {
  initAudio();
  const rect = canvas.getBoundingClientRect();
  const sy = canvas.height / rect.height;
  const posY = (clientY - rect.top) * sy;
  lure.y = Math.max(boat.y + 10, Math.min(H - 10, posY));
}

canvas.addEventListener('mousemove', e => updateRodPosition(e.clientY));

// touchmove con passive: false para poder hacer preventDefault() y evitar scroll
canvas.addEventListener('touchmove', e => {
  e.preventDefault(); 
  updateRodPosition(e.touches[0].clientY);
}, { passive: false });

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  updateRodPosition(e.touches[0].clientY);
}, { passive: false });

// --- CONTROLES BOTONES MÓVILES ---
const btnL = document.getElementById('btnLeft');
const btnR = document.getElementById('btnRight');

const startLeft = (e) => { e.preventDefault(); keys.left = true; initAudio(); };
const stopLeft = (e) => { e.preventDefault(); keys.left = false; };
const startRight = (e) => { e.preventDefault(); keys.right = true; initAudio(); };
const stopRight = (e) => { e.preventDefault(); keys.right = false; };

btnL.addEventListener('touchstart', startLeft, { passive: false });
btnL.addEventListener('touchend', stopLeft, { passive: false });
btnL.addEventListener('mousedown', startLeft);
btnL.addEventListener('mouseup', stopLeft);
btnL.addEventListener('mouseleave', stopLeft);

btnR.addEventListener('touchstart', startRight, { passive: false });
btnR.addEventListener('touchend', stopRight, { passive: false });
btnR.addEventListener('mousedown', startRight);
btnR.addEventListener('mouseup', stopRight);
btnR.addEventListener('mouseleave', stopRight);

resetBtn.addEventListener('click', () => { initGame(); loop(); });

let spawnTimer = 0;
let enemyTimer = 0;
const spawnInterval = 80;
const enemyInterval = 160;

function update() {
  if (gameOver) return;
  frameCount++;
  
  if (keys.left) boat.x -= boat.speed * 1.6;
  if (keys.right) boat.x += boat.speed * 1.6;
  boat.x = Math.max(boat.w/2 + 6, Math.min(W - boat.w/2 - 6, boat.x));
  
  if (keys.left) lure.xOffset = -20;
  if (keys.right) lure.xOffset = 20;

  for (let i = fishes.length - 1; i >= 0; i--) {
    const f = fishes[i];
    const slowdown = slowMotion > 0 ? 0.5 : 1;
    f.wiggle += 0.08 * slowdown;
    f.y += Math.sin(f.wiggle) * 0.3 * slowdown;
    
    if (f.caught) {
      const tx = boat.x + lure.xOffset;
      const ty = lure.y;
      const dx = tx - (f.x + f.w/2);
      const dy = ty - (f.y + f.h/2);
      f.x += dx * 0.18;
      f.y += dy * 0.18;
      if (Math.hypot(dx, dy) < 8) fishes.splice(i,1);
    } else {
      f.x += f.dir * f.speed * slowdown;
      if (checkCollision(f)) catchFish(i);
      if (f.x < -60 || f.x > W + 60) fishes.splice(i,1);
    }
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const slowdown = slowMotion > 0 ? 0.5 : 1;
    e.x += e.dir * e.speed * slowdown;
    
    if (e.name === 'tiburon') e.y += Math.sin(frameCount * 0.05) * 0.2;

    if (checkCollision(e)) {
      if (e.name === 'tiburon') { damageHearts(hearts); } 
      else { damageHearts(e.damage); enemies.splice(i,1); }
    }
    if (e.x < -60 || e.x > W + 60) enemies.splice(i,1);
  }

  if (slowMotion > 0) slowMotion--;
  if (flashTimer > 0) flashTimer--;

  spawnTimer++;
  enemyTimer++;
  if (spawnTimer >= spawnInterval) { spawnTimer = 0; spawnFish(); }
  if (enemyTimer >= enemyInterval) { enemyTimer = 0; spawnEnemy(); }
}

function drawBackground() {
  ctx.fillStyle = "#87CEEB"; ctx.fillRect(0, 0, W, H * 0.25);
  ctx.fillStyle = "#FFD700"; ctx.fillRect(W - 40, 10, 20, 20);
  ctx.fillStyle = "#FFF";
  ctx.fillRect(30, 15, 30, 10); ctx.fillRect(40, 10, 20, 5);
  ctx.fillRect(150, 25, 40, 8); ctx.fillRect(160, 20, 20, 5);
  ctx.fillStyle = "#D2B48C"; ctx.fillRect(0, H * 0.23, W, H * 0.02);
  ctx.fillStyle = "#4AA6DB"; ctx.fillRect(0, H * 0.25, W, H * 0.35);
  ctx.fillStyle = "#2C82C9"; ctx.fillRect(0, H * 0.60, W, H * 0.30);
  ctx.fillStyle = "#E3C565"; ctx.fillRect(0, H - 15, W, 15);
  ctx.fillStyle = "#2E8B57";
  for(let i=0; i<W; i+=40) {
    let height = 10 + (Math.sin(i) * 5);
    ctx.fillRect(i + 10, H - 15 - height, 4, height);
  }
}

function drawBoat(cx, cy) {
  ctx.fillStyle = "#5A2F15"; ctx.fillRect(cx - 24, cy - 2, 48, 10);
  ctx.fillStyle = "#8B4B1E"; ctx.fillRect(cx - 28, cy - 6, 56, 4);
  ctx.fillStyle = "#FFF";    ctx.fillRect(cx - 12, cy - 18, 20, 12);
  ctx.fillStyle = "#4AA6DB"; ctx.fillRect(cx - 6, cy - 14, 8, 6);
  ctx.fillStyle = "#D32F2F"; ctx.fillRect(cx - 14, cy - 22, 24, 4);
}

function drawFish(f) {
  ctx.save(); ctx.translate(f.x, f.y); ctx.fillStyle = f.color;
  ctx.fillRect(0, 0, f.w, f.h);
  ctx.fillRect(f.w/2 - 2, -2, 4, 2); ctx.fillRect(f.w/2 - 2, f.h, 4, 2);
  
  if (f.dir > 0) {
    ctx.fillRect(-4, 0, 4, f.h); ctx.fillRect(-6, -2, 2, f.h+4); 
    ctx.fillStyle = "#FFF"; ctx.fillRect(f.w - 4, 2, 2, 2); 
    ctx.fillStyle = "#000"; ctx.fillRect(f.w - 3, 2, 1, 1); 
  } else {
    ctx.fillRect(f.w, 0, 4, f.h); ctx.fillRect(f.w + 4, -2, 2, f.h+4); 
    ctx.fillStyle = "#FFF"; ctx.fillRect(2, 2, 2, 2); 
    ctx.fillStyle = "#000"; ctx.fillRect(2, 2, 1, 1); 
  }
  if (f.rare) {
    ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 1;
    ctx.strokeRect(-2, -2, f.w+4, f.h+4);
  }
  ctx.restore();
}

function drawEnemy(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  if (e.name === 'mina') {
    ctx.fillStyle = e.color;
    ctx.fillRect(2, 2, e.w-4, e.h-4); 
    ctx.fillRect(e.w/2 - 1, 0, 2, e.h); 
    ctx.fillRect(0, e.h/2 - 1, e.w, 2); 
    if (Math.floor(Date.now() / 250) % 2 === 0) {
      ctx.fillStyle = '#FF5252'; ctx.fillRect(e.w/2 - 1, e.h/2 - 1, 2, 2);
    }
  } 
  else if (e.name === 'cangrejo') {
    ctx.fillStyle = e.color; ctx.fillRect(0, 4, e.w, e.h-4); 
    ctx.fillRect(-2, 0, 4, 6); ctx.fillRect(e.w-2, 0, 4, 6); 
    ctx.fillStyle = "#BF360C"; ctx.fillRect(2, e.h, 2, 2); ctx.fillRect(e.w-4, e.h, 2, 2);
    ctx.fillStyle = '#FFF'; ctx.fillRect(2, 4, 2, 2); ctx.fillRect(e.w-4, 4, 2, 2);
  } 
  else if (e.name === 'tiburon') {
    ctx.fillStyle = e.color; ctx.fillRect(0, 4, e.w, e.h-4); ctx.fillRect(e.w/2 - 2, 0, 6, 4); 
    if (e.dir > 0) {
      ctx.fillRect(-6, 2, 6, e.h-2); ctx.fillRect(-8, 0, 2, e.h+2); 
      ctx.fillStyle = '#FFF'; ctx.fillRect(e.w-4, e.h-2, 4, 2); 
      ctx.fillStyle = '#000'; ctx.fillRect(e.w-6, 4, 2, 2); 
    } else {
      ctx.fillRect(e.w, 2, 6, e.h-2); ctx.fillRect(e.w+6, 0, 2, e.h+2); 
      ctx.fillStyle = '#FFF'; ctx.fillRect(0, e.h-2, 4, 2); 
      ctx.fillStyle = '#000'; ctx.fillRect(4, 4, 2, 2); 
    }
  }
  ctx.restore();
}

function draw() {
  ctx.clearRect(0,0,W,H);
  drawBackground();
  drawBoat(boat.x, boat.y);
  
  const rodX = boat.x + lure.xOffset;
  ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(rodX, boat.y - 2); ctx.lineTo(rodX, lure.y); ctx.stroke();
  ctx.fillStyle = "#FF5252"; ctx.fillRect(rodX - lure.size/2, lure.y - lure.size/2, lure.size, lure.size);

  fishes.forEach(drawFish); enemies.forEach(drawEnemy);

  ctx.fillStyle = "rgba(0, 0, 0, 0.7)"; ctx.fillRect(8, 8, 140, 55);
  ctx.fillStyle = "#fff"; ctx.font = "12px monospace";
  ctx.fillText("PUNTOS: " + score, 14, 22);
  ctx.fillText("MEJOR:  " + bestScore, 14, 37);
  ctx.fillText("VIDAS:  " + "❤️".repeat(hearts), 14, 52);

  if (slowMotion > 0) {
    ctx.fillStyle = "rgba(179, 136, 255, 0.2)"; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = "#B388FF"; ctx.font = "bold 14px monospace";
    ctx.fillText("¡TIEMPO LENTO!", W/2 - 50, 25);
  }
  if (flashTimer > 0) {
    ctx.fillStyle = `rgba(0, 229, 255, ${flashTimer / 15})`; ctx.fillRect(0,0,W,H);
  }
}

function loop() {
  update(); draw();
  if (!gameOver) requestAnimationFrame(loop);
}

for (let i=0;i<6;i++) spawnFish();
loop();
</script>
</body>
</html>
